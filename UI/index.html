<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DicforDev | Team 7</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <script
            src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    </head>

    <body>

        <div class="container">
            <header>
                <h1><i class="fa-solid fa-code"></i> DicForDev <span
                        class="team-tag">Team 7</span></h1>
                <button id="themeToggle" class="theme-btn">🌙</button>
            </header>

            <div class="search-box">
                <input type="text" id="wordInput"
                    placeholder="Type a keyword (e.g. trie, binary_search)..."
                    autofocus>
                <button onclick="handleSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
            </div>

            <div id="resultArea" class="result-card hidden">
                <h2 id="resKeyword"></h2>
                <hr>
                <p id="resDefinition"></p>
                <div class="meta">
                    <span><i class="fa-solid fa-bolt"></i> O(L)
                        Complexity</span>
                </div>
            </div>

            <div id="embedArea" class="result-card hidden">
                <h2>Reference</h2>
                <iframe id="embedFrame"
                    style="width:100%; height:600px; border:none;"></iframe>
            </div>

            <div id="roadmapArea" class="result-card hidden">
                <h2>Roadmap</h2>
                <ul id="roadmapList"></ul>
            </div>

            <div id="graphArea" class="result-card hidden">
                <h2>Roadmap Graph</h2>
                <div id="network" style="height: 600px;"></div>
            </div>

            <div id="loader" class="loader hidden"></div>
        </div>

        <script>
        async function handleSearch() {
            const input = document.getElementById('wordInput');
            const resultArea = document.getElementById('resultArea');
            const loader = document.getElementById('loader');
            const resKeyword = document.getElementById('resKeyword');
            const resDefinition = document.getElementById('resDefinition');

            const word = input.value.trim();
            if (!word) return;

            loader.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                const response = await fetch(`/search?word=${word}`);
                const data = await response.json();

                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                resKeyword.innerText = "Search";

                const def = data.definition || "";

                if (def.startsWith("http")) {
                    try {
                        const domain = new URL(def).hostname;

                        resDefinition.innerHTML = `
                            <a href="${def}" target="_blank" class="ref-btn">
                                📘 Open on ${domain}
                            </a>
                        `;
                    } catch {
                        resDefinition.innerHTML = `
                            <a href="${def}" target="_blank" class="ref-btn">
                                📘 Open Reference
                            </a>
                        `;
                    }
                } else {

                    resDefinition.innerText = def;
                }

                resultArea.classList.remove('hidden');

            } catch (err) {
                console.error("Fetch error:", err);
                alert("Cannot connect to server!");
            } finally {
                loader.classList.add('hidden');
            }

            loadRoadmap(word);
        }

        async function loadRoadmap(word) {
            const roadmapArea = document.getElementById('roadmapArea');
            const list = document.getElementById('roadmapList');

            try {
                const res = await fetch(`/roadmap?word=${word}`);
                const data = await res.json();

                list.innerHTML = "";

                data.forEach(item => {
                    const li = document.createElement("li");
                    li.innerText = item;

                    li.style.cursor = "pointer";
                    li.onclick = () => {
                        document.getElementById('wordInput').value = item;
                        handleSearch();
                    };

                    list.appendChild(li);
                });

                drawGraph(data);

                roadmapArea.classList.remove('hidden');
            } catch (err) {
                console.error("Roadmap error:", err);
            }
        }

        function drawGraph(data) {
            const container = document.getElementById('network');

            const nodes = data.map((item, index) => ({
                id: index,
                label: item
            }));

            const edges = [];
            for (let i = 0; i < data.length - 1; i++) {
                edges.push({
                    from: i,
                    to: i + 1,
                    arrows: 'to'
                });
            }

            const networkData = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(edges)
            };

            const options = {
                nodes: {
                    shape: 'box',
                    color: '#38bdf8',
                    font: {
                        color: 'white',
                        size: 18
                    },
                    margin: 12
                },
                edges: {
                    color: 'black',
                    arrows: {
                        to: {
                            enabled: true
                        }
                    }
                },
                layout: {
                    hierarchical: {
                        direction: "LR"
                    }
                }
            };

            new vis.Network(container, networkData, options);

            document.getElementById('graphArea').classList.remove('hidden');
            const network = new vis.Network(container, networkData, options);

            network.on("click", function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const word = data[nodeId];

                    document.getElementById('wordInput').value = word;
                    handleSearch();
                }
            });
        }

        const toggleBtn = document.getElementById('themeToggle');

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            toggleBtn.innerText = "☀️";
        }

        toggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
                toggleBtn.innerText = "☀️";
            } else {
                localStorage.setItem("theme", "light");
                toggleBtn.innerText = "🌙";
            }
        });

        let debounceTimer;

        document.getElementById('wordInput').addEventListener('input', () => {
            clearTimeout(debounceTimer);

            debounceTimer = setTimeout(() => {
                handleSearch();
            }, 100);
        });
    </script>
    </body>

</html>
